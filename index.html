<!DOCTYPE html>
<html lang="sv">

<head>
    <!-- Teckenkodning -->
    <meta charset="UTF-8">

    <!-- Anpassar sidan för mobil och olika skärmstorlekar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titel i webbläsarfliken -->
    <title>Fake Google</title>

    <!-- Kopplar CSS-filen -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Övre navigationsfält -->
    <header>

        <!-- Länkar till vänster -->
        <div class="left-nav">
            <a href="#">Om</a>
            <a href="#">Store</a>
        </div>

        <!-- Länkar till höger -->
        <div class="right-nav">

            <a href="#">Gmail</a>
            <a href="#">Bilder</a>

            <!-- Google Apps-ikon (9 punkter) -->
            <div class="apps">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>

            <!-- Profilikon -->
            <div class="profile">
                V
            </div>

        </div>

    </header>

    <!-- Huvudinnehåll -->
    <main>

        <!-- Google-loggan -->
        <div class="logo">
            Google
        </div>

        <!-- Sökområde -->
        <div class="search-wrapper">

            <!-- Sökrutan -->
            <div class="search-box">

                <!-- Plus-symbol -->
                <div class="plus">+</div>

                <!-- Inmatningsfält -->
                <input type="text" placeholder="">

                <!-- Ikoner till höger -->
                <div class="icons">

                    <span>⌨</span>
                    <span>🎤</span>
                    <span>📷</span>

                    <!-- AI-knapp -->
                    <button class="ai-btn">
                        AI-läge
                    </button>

                </div>

            </div>

            <!-- Knappar under sökrutan -->
            <div class="buttons">

                <button>Sök på Google</button>
                <button>Jag har tur</button>

            </div>

        </div>

    </main>

    <!-- Sidfot -->
    <footer>

        <!-- Land -->
        <div class="country">
            Sverige
        </div>

        <!-- Nedre del av sidfoten -->
        <div class="footer-bottom">

            <!-- Vänstra länkar -->
            <div class="footer-left">
                <a href="#">Annonsering</a>
                <a href="#">Företagslösningar</a>
                <a href="#">Så fungerar Sök</a>
            </div>

            <!-- Mitten-text -->
            <div class="footer-center">
                🍃 Koldioxidneutralt sedan 2007
            </div>

            <!-- Högra länkar -->
            <div class="footer-right">
                <a href="#">Integritet</a>
                <a href="#">Villkor</a>
                <a href="#">Inställningar</a>
            </div>

        </div>

    </footer>

</body>
</html>
